<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stage</title>
<style>
  :root { --bg: #0b0d12; --ink: #f4f6fb; --ink-2: #a9b1c4; --accent: #2456e8; --accent-2: #6a8cf7; --accent-rgb: 36,86,232; --font: Geist; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font), "Segoe UI", sans-serif; overflow: hidden; }
  .glow { position: fixed; inset: -20%; background:
      radial-gradient(40% 45% at 78% 22%, rgba(var(--accent-rgb),.28), transparent 70%),
      radial-gradient(35% 40% at 12% 88%, rgba(var(--accent-rgb),.10), transparent 70%);
    animation: drift 14s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(-3%, 2%) scale(1.06); } }
  .card { position: fixed; inset: 0; display: grid; align-content: center; padding: 0 160px; opacity: 0; }
  .card.on { opacity: 1; animation: push 9s linear forwards; }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.045); } }
  .kicker { font-size: 26px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); opacity: 0; transform: translateY(14px); }
  .on .kicker { animation: rise .9s var(--ease) .1s forwards; }
  h1 { margin: 22px 0 0; font-size: 104px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 650; max-width: 16ch; }
  h1 .w { display: inline-block; opacity: 0; transform: translateY(46px); filter: blur(8px); }
  .on h1 .w { animation: word 1s var(--ease) forwards; }
  @keyframes word { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .sub { margin-top: 30px; font-size: 34px; color: var(--ink-2); max-width: 40ch; line-height: 1.35; opacity: 0; transform: translateY(14px); }
  .on .sub { animation: rise 1s var(--ease) forwards; }
  h1 em { font-style: normal; color: var(--accent-2); }

  /* Logo tile: pops in; SVG parts with classes a, b, c assemble one after another */
  .mark-tile { width: 240px; height: 240px; border-radius: 56px; background: var(--accent); display: grid; place-items: center; box-shadow: 0 30px 90px rgba(var(--accent-rgb),.45); opacity: 0; transform: scale(.6); }
  .mark-tile:empty { display: none; }
  .on .mark-tile { animation: pop 1.1s cubic-bezier(.2,1.3,.35,1) forwards; }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .mark-tile svg { width: 200px; height: 200px; }
  .mark-tile svg * { fill: #fff; }
  .mark-tile .a, .mark-tile .b, .mark-tile .c { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .on .mark-tile .a { animation: inL 1s var(--ease) .15s forwards; }
  .on .mark-tile .b { animation: inR 1s var(--ease) .3s forwards; }
  .on .mark-tile .c { animation: inU 1s var(--ease) .45s forwards; }
  @keyframes inL { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
  @keyframes inR { from { opacity: 0; transform: translateX(60px); } to { opacity: var(--b-opacity, 1); transform: none; } }
  @keyframes inU { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  .word { margin-top: 48px; font-size: 128px; font-weight: 650; letter-spacing: -0.045em; opacity: 0; transform: translateY(30px); }
  .on .word { animation: rise 1s var(--ease) .75s forwards; }
  #intro { justify-items: center; text-align: center; padding: 0; }
  #intro .sub { margin-top: 18px; text-align: center; max-width: none; }
  .on#intro .sub { animation-delay: 1.15s; }

  #end { justify-items: start; }
  .end-row { display: flex; align-items: center; gap: 28px; }
  .end-row .mark-tile { width: 120px; height: 120px; border-radius: 30px; }
  .end-row .mark-tile svg { width: 100px; height: 100px; }
  .end-row .word { margin: 0; font-size: 96px; }
  #end .sub { animation-delay: .9s; }
  .links { margin-top: 56px; display: grid; gap: 18px; }
  .link { font-family: "Geist Mono", ui-monospace, monospace; font-size: 40px; opacity: 0; transform: translateY(14px); display: flex; gap: 20px; align-items: baseline; }
  .link b { font-family: var(--font), sans-serif; font-weight: 500; font-size: 24px; color: var(--ink-2); width: 150px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="glow"></div>

<section class="card" id="intro">
  <div class="mark-tile"></div>
  <div class="word"></div>
  <div class="sub"></div>
</section>

<section class="card" id="title">
  <div class="kicker"></div>
  <h1></h1>
  <div class="sub"></div>
</section>

<section class="card" id="end">
  <div class="end-row"><div class="mark-tile"></div><div class="word"></div></div>
  <div class="sub"></div>
  <div class="links"></div>
</section>

<script>
  // stageSetup({ name, tagline, logo (inline <svg>), theme: {canvas, accent, accent2, font}, end: { line, links: [[label, value]] } })
  window.stageSetup = (c) => {
    const t = Object.assign({ canvas: "#0b0d12", accent: "#2456e8", accent2: "#6a8cf7", font: "Geist" }, c.theme || {});
    const n = parseInt(t.accent.replace("#", ""), 16);
    const r = document.documentElement.style;
    r.setProperty("--bg", t.canvas);
    r.setProperty("--accent", t.accent);
    r.setProperty("--accent-2", t.accent2);
    r.setProperty("--accent-rgb", `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`);
    r.setProperty("--font", `"${t.font}"`);
    const fonts = document.createElement("link");
    fonts.rel = "stylesheet";
    fonts.href = t.fontUrl || `https://fonts.googleapis.com/css2?family=${encodeURIComponent(t.font)}:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap`;
    document.head.appendChild(fonts);
    for (const tile of document.querySelectorAll(".mark-tile")) tile.innerHTML = c.logo || "";
    for (const w of document.querySelectorAll(".word")) w.textContent = c.name || "";
    document.querySelector("#intro .sub").textContent = c.tagline || "";
    document.querySelector("#end .sub").textContent = c.end?.line || "";
    document.querySelector(".links").innerHTML = (c.end?.links || [])
      .map(([k, v], i) => `<div class="link" style="animation: rise 1s var(--ease) ${1.1 + i * 0.2}s forwards"><b>${k}</b>${v}</div>`)
      .join("");
  };

  // show("intro") | show("end") | show("title", {kicker, title, sub}); words in *stars* are accented.
  window.show = (id, t = {}) => {
    for (const c of document.querySelectorAll(".card")) c.classList.remove("on");
    const card = document.getElementById(id);
    if (id === "title") {
      card.querySelector(".kicker").textContent = t.kicker || "";
      const words = (t.title || "").split(" ");
      card.querySelector("h1").innerHTML = words
        .map((w, i) => {
          const acc = /^\*.*\*[.,!?]?$/.test(w);
          const clean = w.replace(/\*/g, "");
          return `<span class="w" style="animation-delay:${0.25 + i * 0.09}s">${acc ? `<em>${clean}</em>` : clean}</span>`;
        })
        .join(" ");
      const sub = card.querySelector(".sub");
      sub.textContent = t.sub || "";
      sub.style.animationDelay = `${0.45 + words.length * 0.09}s`;
    }
    void card.offsetWidth;
    card.classList.add("on");
  };
</script>
</body>
</html>
